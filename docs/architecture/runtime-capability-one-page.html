<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Domainry Runtime 完整能力讲解</title>
  <style>
    :root {
      --ink:#15213b; --muted:#5d687a; --line:#d9e2ed; --paper:#fff; --canvas:#e9eef5;
      --blue:#2864d7; --blue-soft:#eef5ff; --red:#b34e46; --red-soft:#fff4f2;
      --teal:#117b78; --teal-soft:#edf9f7; --amber:#8b6518; --amber-soft:#fff8e8;
      --purple:#6848b3; --purple-soft:#f5f1ff; --navy:#17233d;
      font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    }
    *{box-sizing:border-box} html,body{margin:0;background:var(--canvas);color:var(--ink)}
    body{padding:22px 0 44px}.sheet{width:min(1180px,calc(100vw - 32px));min-height:770px;margin:0 auto 22px;padding:34px 42px 24px;display:flex;flex-direction:column;overflow:hidden;background:var(--paper);border:1px solid #dce4ee;border-radius:20px;box-shadow:0 18px 55px rgba(26,45,77,.10)}
    .page-head{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:start;padding-bottom:15px;border-bottom:2px solid var(--ink)}
    .eyebrow{margin:0 0 7px;color:var(--blue);font-size:13px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}
    h1{margin:0;font-size:30px;line-height:1.18;letter-spacing:-.025em}.subtitle{margin:7px 0 0;color:var(--muted);font-size:14.5px;line-height:1.5}
    .page-no{min-width:88px;padding:12px 13px;color:#fff;background:var(--navy);border-radius:14px;text-align:center}.page-no b{display:block;font-size:27px;line-height:1}.page-no span{display:block;margin-top:5px;font-size:11px;opacity:.74}
    .claim{margin-top:14px;padding:13px 17px;display:grid;grid-template-columns:108px 1fr;gap:14px;align-items:center;color:#fff;background:linear-gradient(95deg,#17233d,#20365f);border-radius:14px}.claim span{color:#9fc4ff;font-size:13px;font-weight:800;letter-spacing:.07em}.claim strong{font-size:18.5px;line-height:1.4}
    .scenario{margin-top:12px;padding:9px 13px;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;color:#3c4960;background:#f7f9fc;border:1px solid var(--line);border-radius:11px;font-size:13.5px;line-height:1.48}.scenario b{padding:4px 9px;color:var(--blue);background:var(--blue-soft);border-radius:999px;white-space:nowrap}
    .contrast{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:13px}.approach{padding:14px 16px;border:1px solid var(--line);border-radius:14px}.approach.normal{background:var(--red-soft);border-color:#efd3cf}.approach.domainry{background:var(--blue-soft);border-color:#ccdcf6}
    .approach h2{margin:0 0 7px;display:flex;align-items:center;gap:8px;font-size:16.5px}.approach h2:before{content:"";width:8px;height:8px;flex:0 0 8px;border-radius:50%;background:currentColor}.normal h2{color:var(--red)}.domainry h2{color:var(--blue)}
    .approach ul{margin:0;padding-left:18px;color:#344159;font-size:12.7px;line-height:1.48}.approach li+li{margin-top:3px}.approach li::marker{color:currentColor}
    .flow{margin-top:8px;display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.flow span{position:relative;padding:7px 4px;color:#284774;background:rgba(255,255,255,.72);border:1px solid #cddcf3;border-radius:8px;font-size:10.8px;font-weight:700;text-align:center;line-height:1.3}.flow span:not(:last-child):after{content:"›";position:absolute;right:-7px;top:50%;z-index:2;transform:translateY(-52%);color:var(--blue);font-size:17px}
    .strength-label{margin:12px 0 7px;display:flex;align-items:center;gap:9px;font-size:15.5px}.strength-label:after{content:"";height:1px;flex:1;background:var(--line)}
    .strengths{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.strength{padding:10px 12px;background:var(--teal-soft);border:1px solid #cee9e5;border-radius:11px}.strength b{display:block;margin-bottom:3px;color:var(--teal);font-size:12.5px}.strength span{display:block;color:#344c50;font-size:12px;line-height:1.42}
    .bottom{margin-top:10px;display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:9px}.bottom-card{padding:9px 12px;border-radius:11px;font-size:11.8px;line-height:1.42}.bottom-card b{display:block;margin-bottom:3px;font-size:12.3px}.user{color:#604b1c;background:var(--amber-soft);border:1px solid #f0dfb9}.user b{color:var(--amber)}.fit{color:#4d406b;background:var(--purple-soft);border:1px solid #ddd3f4}.fit b{color:var(--purple)}.flex{color:#455166;background:#f3f6fa;border:1px solid var(--line)}.flex b{color:#34445e}
    footer{margin-top:auto;padding-top:9px;display:flex;justify-content:space-between;gap:18px;color:#7a8596;font-size:10.3px;border-top:1px solid #e8edf3}footer strong{color:#47546a}
    .cover{position:relative;padding:50px 58px 34px;color:#fff;background:linear-gradient(135deg,#101a31 0%,#18294a 58%,#24477d 100%);border:0}
    .cover:before,.cover:after{content:"";position:absolute;border-radius:50%;pointer-events:none}.cover:before{width:430px;height:430px;right:-155px;top:-180px;background:radial-gradient(circle,rgba(82,145,255,.38),rgba(82,145,255,0) 69%)}.cover:after{width:360px;height:360px;left:-160px;bottom:-215px;background:radial-gradient(circle,rgba(39,205,193,.22),rgba(39,205,193,0) 68%)}
    .cover-content{position:relative;z-index:1;max-width:980px;margin-top:74px}.cover .eyebrow{color:#8eb9ff;font-size:14px}.cover h1{max-width:900px;margin-top:16px;color:#fff;font-size:57px;line-height:1.12;letter-spacing:-.04em}.cover .lead{max-width:900px;margin:22px 0 0;color:#d6e2f5;font-size:22px;line-height:1.62}
    .cover-rule{position:relative;z-index:1;width:112px;height:5px;margin-top:30px;background:#4f8df7;border-radius:99px}.cover-promise{position:relative;z-index:1;margin-top:44px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.cover-promise span{padding:16px 18px;color:#dce8fa;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:13px;font-size:14px;font-weight:700}.cover footer{position:relative;z-index:1;color:#aabbd4;border-color:rgba(255,255,255,.18)}.cover footer strong{color:#e9f1ff}
    @page{size:A4 landscape;margin:7mm}
    @media print{
      html,body{background:#fff}body{padding:0}.sheet{width:283mm;height:196mm;min-height:196mm;margin:0;padding:7.5mm 9mm 5mm;border:0;border-radius:0;box-shadow:none;break-after:page;page-break-after:always}.sheet:last-child{break-after:auto;page-break-after:auto}
      .page-head{padding-bottom:2.8mm}.eyebrow{margin-bottom:1mm;font-size:8.5pt}h1{font-size:20pt}.subtitle{margin-top:1.2mm;font-size:9.7pt;line-height:1.4}.page-no{min-width:20mm;padding:3mm}.page-no b{font-size:18pt}
      .claim{margin-top:2.6mm;padding:2.7mm 3.5mm;grid-template-columns:27mm 1fr}.claim span{font-size:8.5pt}.claim strong{font-size:12.8pt}.scenario{margin-top:2.2mm;padding:1.8mm 2.7mm;font-size:9pt}
      .contrast{margin-top:2.2mm;gap:2.5mm}.approach{padding:2.5mm 3mm}.approach h2{margin-bottom:1.3mm;font-size:11pt}.approach ul{padding-left:4.3mm;font-size:8.5pt;line-height:1.38}.approach li+li{margin-top:.5mm}.flow{margin-top:1.5mm;gap:1mm}.flow span{padding:1.3mm .8mm;font-size:7.2pt}
      .strength-label{margin:2.2mm 0 1.3mm;font-size:10.5pt}.strengths{gap:1.8mm}.strength{padding:1.8mm 2.2mm}.strength b{margin-bottom:.5mm;font-size:8.5pt}.strength span{font-size:8pt;line-height:1.35}
      .bottom{margin-top:1.8mm;gap:1.8mm}.bottom-card{padding:1.6mm 2.2mm;font-size:7.8pt;line-height:1.34}.bottom-card b{margin-bottom:.4mm;font-size:8.2pt}footer{padding-top:1.3mm;font-size:7pt}
      .cover{padding:13mm 15mm 8mm}.cover-content{margin-top:18mm}.cover .eyebrow{font-size:10pt}.cover h1{margin-top:4mm;font-size:39pt}.cover .lead{margin-top:5mm;font-size:15pt}.cover-rule{width:28mm;height:1.2mm;margin-top:7mm}.cover-promise{margin-top:11mm;gap:3mm}.cover-promise span{padding:4mm 4.5mm;font-size:9.5pt}
      .cover:after{display:none}
    }
    @media screen and (max-width:850px){body{padding:0}.sheet{width:100%;min-height:0;margin:0;padding:24px 18px;border:0;border-radius:0}.page-head{grid-template-columns:1fr}.page-no{display:none}.claim{grid-template-columns:1fr;gap:4px}.contrast,.strengths,.bottom{grid-template-columns:1fr}.flow{grid-template-columns:1fr}.flow span:after{display:none}}
  </style>
</head>
<body>
  <script>
    const capabilities = [
      {
        group:"Runtime Core", name:"Object + Record", title:"声明业务对象，不是生成一套散装 CRUD",
        subtitle:"字段、关系和页面只是表面；真正价值是所有数据入口共享相同的查询、权限、生命周期和变更规则。",
        claim:"强的不是少写一个 Controller，而是新增页面、导入、流程或 Agent 后，仍然只有一套数据规则。",
        scenario:"客户最初只有列表和编辑，后来增加批量导入、审批、夜间同步和 AI 助手。每增加一个入口，都可能多出一套校验与写库逻辑。",
        normal:["每个实体重复表、ORM、Repository、Controller、分页、关联和软删除。","页面、脚本、Cron 和 Workflow 分别实现校验、授权与状态判断。","字段可写性、数据范围、导出控制和审计依靠开发者逐处记住。","为了赶进度保留“内部直接写库”，最终绕过业务不变量。"],
        domainry:["项目声明 Object 字段、关系、校验、能力和生命周期。","Record 统一查询、过滤、排序、分页、关联与通用变更。","Runtime 自动应用 Workspace、行级、字段、关联与导出策略。","append-only、soft-delete、状态后不可变等约束覆盖所有入口。"],
        flow:["Object 定义","发布校验","获权 Record","统一 Mutation","Audit/Event"],
        strengths:[["单一业务真相","字段、能力、权限和 API 投影来自同一份已发布定义。"],["入口越多价值越大","HTTP、批量、流程和 Agent 不再复制对象规则。"],["生命周期不可旁路","账本或已完成记录不会被另一个入口悄悄改写。"]],
        user:"列表、详情、关联、导入和导出行为一致；重复提交与并发冲突有明确结果。", fit:"CRM、订单、合同、主数据，以及对象多、入口持续增加的企业应用。", flex:"简单对象直接用通用 Record；复杂操作随时提升为 Action，不替换底座。"
      },
      {
        group:"Runtime Core", name:"Action", title:"用具名业务动作替代万能 Service",
        subtitle:"“批准、取消、结算”不是普通字段更新，而是带输入、风险、前置条件、审计和副作用边界的业务能力。",
        claim:"强在把“代码理论上能做什么”收紧为“这个 Action 本次被允许做什么”。",
        scenario:"order.cancel 只应读取当前订单、写取消记录、调用指定退款操作并发出取消通知；它不应因为拿到 Service Container 就能访问工资或任意外部连接。",
        normal:["Controller 把数据库、HTTP Client、MQ 和所有 Repository 交给 Service。","请求 DTO、授权、状态前置条件、版本和审计由每个接口自行维护。","业务代码实际拥有大权限，只能依赖评审和开发者自觉不越界。","接口、SDK 与实现合同升级不同步，通常到运行时才暴露。"],
        domainry:["Action 声明输入输出、前置条件、风险、审计事件和并发策略。","Effect Set 精确授予 Object、Connector、文件和通知能力。","生成的 Handler 只拿到本 Action 所需的最小能力。","启动时核对合同 hash、Handler revision 并冻结 Registry。"],
        flow:["Action 合同","能力授权","最小 Handler","结果校验","审计输出"],
        strengths:[["最小能力执行","业务代码不再获得整个 Runtime 或全部 Repository。"],["合同先于实现","输入、输出、风险与副作用在开发和启动阶段即可校验。"],["业务语义可复用","页面、Workflow、Scheduler 和 Agent 调用同一个具名动作。"]],
        user:"看到“提交审批、取消订单”等稳定操作；成功、失败和权限不足都有一致结果。", fit:"审批、订单状态、资金、库存、批量动作和任何不能直接改字段的业务。", flex:"项目自由编写领域 Handler，框架只约束它能访问的能力和必须兑现的合同。"
      },
      {
        group:"Runtime Core", name:"Mutation Kernel", title:"所有写入口共享事务、并发与幂等规则",
        subtitle:"正确性不能只存在于用户接口；后台任务、流程、导入和 AI 触发的写入也必须经过同一执行内核。",
        claim:"强在让“先查再写、重复请求、并发修改”不再由每个业务团队各自踩坑。",
        scenario:"课程只剩一个名额，两名用户同时预约。普通的“先查 remaining > 0，再减一”会超卖；后台重试还可能重复扣减。",
        normal:["用户接口走 Service 校验，Cron 和 Workflow 直接更新 Repository。","以先查询后更新实现库存、额度和状态判断，产生竞态。","乐观锁、条件更新、原子算术与业务错误各对象各写一套。","幂等只在部分 HTTP 接口存在，Worker 与导入重试仍会重复生效。"],
        domainry:["HTTP、Action、Workflow、Automation、Scheduler 和 Agent 最终都进入 Mutation Kernel。","统一执行授权、不可变上下文、规划、验证与事务提交。","支持 expected version、条件谓词和原子算术更新。","同一提交可携带 Audit、Event、Outbox 与幂等 Receipt。"],
        flow:["授权上下文","规划 Mutation","条件/版本校验","原子提交","Receipt"],
        strengths:[["并发正确性内建","用数据库条件更新表达业务约束，而非依赖应用层时序。"],["所有入口同规则","不存在“内部任务比较可信”而绕过校验的特殊路径。"],["重复请求有稳定结果","重试同一业务 identity，不重复制造业务效果。"]],
        user:"重复点击不重复执行；过期页面提示冲突；抢购、库存和额度在并发下仍保持正确。", fit:"库存、预约、余额、审批状态、计数器和多入口共享写操作。", flex:"项目选择业务条件和冲突语义；内核负责跨数据库兑现一致执行。"
      },
      {
        group:"Identity Module + Runtime", name:"Identity + Authorization", title:"用户、组织和角色为什么必须分开",
        subtitle:"用户回答“谁负责”，组织回答“管到哪里”，角色回答“能做什么”；Workspace 构成不可跨越的租户边界。",
        claim:"强在把稳定职责与变化范围分开：调岗只改变组织事实，不改角色、SQL 和业务代码。",
        scenario:"张三是销售经理，在华东管理华东门店，调到华南后职责没变、范围变了；兼任财务审批时又增加一项职能。",
        normal:["users(role_id, department_id)，接口里判断 role 并手写部门过滤。","岗位和区域组合成“华东经理、华南经理”，组织越多角色越多。","调岗、兼岗与临时授权逐人修补，旧权限难以及时回收。","列表、报表、导出、后台任务和 AI 各自解释权限。"],
        domainry:["Workspace 是租户硬边界，User 是稳定责任主体。","Org 解析当前组织、组织子树、上下级和汇报范围。","Role 表达可复用职能，多角色组合后生成版本化 AccessBundle。","Runtime 统一执行功能、数据、字段、关联、导出和 Guardrail 策略。"],
        flow:["Workspace","User","Org Scope","Role","AccessBundle"],
        strengths:[["角色不再随区域爆炸","同一个销售经理角色可复用于不同组织范围。"],["组织变化自动传导","新增门店或调岗后重新解析范围，无需修改查询代码。"],["全入口一个答案","同一身份在列表、报表、流程和 Agent 中得到相同权限。"]],
        user:"员工看本人、主管看团队；敏感字段自动隐藏或脱敏；调岗后旧区域不再可见。", fit:"多租户、多分公司、层级组织、区域经营、兼岗和服务身份。", flex:"身份目录与组织结构可以变化，业务对象不绑定某个部门或固定组合角色。"
      },
      {
        group:"Runtime Core", name:"Assurance", title:"高风险操作不能只靠“已经登录”",
        subtitle:"登录证明了身份，却不代表此刻可以批量导出、批准大额付款或执行不可逆删除。",
        claim:"强在把二次验证、双人复核和流程批准做成 Action 的可验证前置证据，而不是页面约定。",
        scenario:"财务用户已登录半天，现在批准一笔大额付款。系统需要 recent re-auth 或 OTP；超过阈值还需要 maker-checker，并防止同一证据被换参数重放。",
        normal:["前端弹一次验证码，后端仅检查一个临时布尔值。","不同敏感接口各接一套 OTP、二次登录或人工复核逻辑。","验证证据没有绑定 Workspace、Action、Record 和 payload，可被挪用。","后台入口或 Agent 工具忘记做二次确认，形成旁路。"],
        domainry:["Action 显式声明 recent re-auth、OTP、maker-checker 或 workflow approval。","证据绑定用户、Workspace、Action、记录和请求 payload。","Runtime 在执行前验证时效、适用范围并按策略消费证据。","任何入口调用高风险 Action 都必须满足同一 Assurance。"],
        flow:["识别风险","生成挑战","绑定操作证据","执行时验证","消费/审计"],
        strengths:[["风险策略不散落","安全要求随 Action 合同走，而不是随某个页面走。"],["防重放与换参","证据只对指定主体、记录和请求内容有效。"],["自动化不能跳过","Workflow、批处理和 Agent 也必须提供合格证据。"]],
        user:"敏感导出、付款和删除会得到清晰的再验证或复核步骤，普通操作不被无谓打扰。", fit:"资金、隐私数据、大批量导出、不可逆操作和高权限管理。", flex:"项目按风险选择保障方式与阈值，Runtime 统一验证，不绑定单一认证产品。"
      },
      {
        group:"Runtime Core", name:"Workflow", title:"让审批过程拥有自己的状态，而不是塞进业务表",
        subtitle:"多节点、等待、人工决策、退回、撤回、超时和升级是过程事实，不应靠几个 status 字段拼出来。",
        claim:"强在定义升级、服务重启和异常恢复后，运行中的流程仍保留原来的业务语义。",
        scenario:"采购单先由主管审批，再由财务审批；可退回、撤回，48 小时未处理要提醒并升级，失败后允许管理员从原节点恢复。",
        normal:["在采购表加 status、approver、approved_at，并不断扩字段。","自建流程定义、实例、节点、任务、事件和审批人解析。","补 any/all/sequential、退回撤回、Timer、提醒升级和操作台。","新流程定义发布后，旧实例如何继续运行经常没有版本策略。"],

        <section class="bottom"><div class="bottom-card user"><b>用户能感知什么</b>${esc(capability.user)}</div><div class="bottom-card fit"><b>适配场景</b>${esc(capability.fit)}</div><div class="bottom-card flex"><b>灵活性体现</b>${esc(capability.flex)}</div></section>
        <footer><span><strong>讲解顺序：</strong>先讲开发现场，再讲普通代价，最后落到三项核心强点。</span><span>${index + 2} / ${capabilities.length + 1}</span></footer>
      </main>`;
    };
    document.body.innerHTML = renderCover() + capabilities.map(render).join("");
  </script>
</body>
</html>
